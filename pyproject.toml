[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operator-gates"
version = "0.2.1"
description = "Fail-closed send/money gates for agent-operated companies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Greg Freda", email = "greg@gregfredabytes.com" }]
keywords = ["agents", "gates", "hitl", "operator", "mail", "money"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/GFB2026/operator-gates"
Documentation = "https://gregfredabytes.com/essay/mail-as-front-door/"
"Peer desk" = "https://gregfredabytes.com/"
Scar = "https://github.com/GFB2026/operator-gates/blob/main/scars/001-stale-mirror-before-send.md"

[project.scripts]
operator-gates = "operator_gates.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
